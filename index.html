<!DOCTYPE html>
<html lang="vi">
<head>

<style>

:root[data-theme="dark"]{--bg:#0e1714;--surface:#172420;--ink:#e6f0ec;--muted:#93a9a1;--line:#2a3b36;--accent:#4fd1b5;--accent-ink:#06201a;
--c-food:#fdba74;--c-food-bg:#4a2410;--c-mem:#93c5fd;--c-mem-bg:#1a2b57;--c-idea:#d8b4fe;--c-idea-bg:#3a1f55;--c-todo:#6ee7b7;--c-todo-bg:#0f3d30;--c-other:#cbd5e1;--c-other-bg:#2b3541}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:0 0 14px;font-weight:700}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}

.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}

.map{text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.del{margin-left:auto;background:none;border:0;color:var(--muted);padding:2px 6px}

.tools{display:flex;gap:12px;justify-content:center;margin-top:20px}

.sync{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.sync input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;width:200px}

:root{--good:#047857;--bad:#b91c1c;--k0:#c2410c;--k1:#1d4ed8;--k2:#7e22ce;--k3:#0f766e;--k4:#be185d;--k5:#15803d;--k6:#64748b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--good:#6ee7b7;--bad:#fca5a5;--k0:#fdba74;--k1:#93c5fd;--k2:#d8b4fe;--k3:#5eead4;--k4:#f9a8d4;--k5:#86efac;--k6:#cbd5e1}}
:root[data-theme="dark"]{--good:#6ee7b7;--bad:#fca5a5;--k0:#fdba74;--k1:#93c5fd;--k2:#d8b4fe;--k3:#5eead4;--k4:#f9a8d4;--k5:#86efac;--k6:#cbd5e1}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.seg{margin-bottom:12px}

.cv{font-size:13px;color:var(--muted);white-space:nowrap}
.dh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 2px 6px}

.tx .pick{grid-column:1/-1}
.dtn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:3px 10px;font-size:13px}
.done .tdesc{text-decoration:line-through;color:var(--muted)}
.ebtn{margin-left:auto;background:none;border:0;color:var(--muted);padding:2px 6px}
.ebtn+.del{margin-left:0}
.ed{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;outline:none}
textarea.ed{min-height:64px;resize:vertical}
.ed:focus-visible,.ebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add.sm{padding:5px 14px;font-size:14px}
.edit .meta{margin-top:8px}
svg text{font-family:inherit}
</style>
</head>
<body>
<main>
<h1>Ghi chú nhanh</h1>
<div class="tabs"><button class="chip" data-tab="notes" aria-pressed="true">Ghi chú</button><button class="chip" data-tab="fin" aria-pressed="false">Chi tiêu</button></div>
<div id="notesView">
<div class="box">
<textarea id="in" placeholder="Gõ gì cũng được, ví dụ: bún chả Hương Liên Hai Bà Trưng, ngon, nhớ quay lại" autofocus></textarea>
<div class="row"><span class="hint">Enter để lưu. Xuống dòng: Shift+Enter</span><button class="add" id="add">Lưu</button></div>
</div>
<div class="hint" id="in-msg" style="margin-top:6px" role="status"></div>
<div class="filters" id="filters"></div>
<input class="search" id="q" type="search" placeholder="Tìm trong ghi chú">
<div id="list"></div>
</div>
<div id="finView" hidden>
<div class="seg"><button class="chip" data-sub="tx" aria-pressed="true">Thu chi</button><button class="chip" data-sub="debt" aria-pressed="false">Nợ</button></div>
<div id="finTop"></div>
<div id="finSheet" class="sheet" hidden><div class="box"><div class="shead"><b id="sheet-title">Thêm khoản mới</b><button class="x" data-sheetclose="1" aria-label="Đóng">×</button></div><input id="fin-in" class="fin-in" type="text" autocomplete="off" enterkeyhint="done" placeholder="45k phở bò · 1tr2 tiền điện · +15tr lương">
<div class="row"><input type="date" id="fin-date" class="date" aria-label="Ngày"><span><button class="add" id="fin-add">Lưu</button><span id="fin-debt" hidden><button class="add" data-dir="owe">Mình nợ</button> <button class="add alt" data-dir="lent">Họ nợ mình</button></span></span></div>
<div class="hint" id="fin-msg" style="margin-top:6px"></div></div></div>
<div id="finBody" style="margin-top:14px"></div>
</div>

<div class="sync"><input id="code" placeholder="Mã đồng bộ" autocomplete="off" spellcheck="false"><button id="conn">Kết nối</button><button id="gen">Tạo mã mới</button><button id="off">Ngắt</button><span id="st" class="hint"></span></div>
<div class="tools"><button id="copy">Sao chép tất cả</button><button id="theme">Đổi giao diện</button></div>
</main>
<script>
var CATS={food:{n:"Quán ăn",c:"food"},mem:{n:"Cần nhớ",c:"mem"},idea:{n:"Ý tưởng",c:"idea"},todo:{n:"Việc cần làm",c:"todo"},other:{n:"Khác",c:"other"}};
var KEYS=Object.keys(CATS),BASE=Object.assign({},CATS),PAL=["food","mem","idea","todo"];
function tagStore(){return notes.find(function(x){return x.k==="ctags"&&x.fin})}
function applyCustom(){CATS=Object.assign({},BASE);var st=tagStore();((st&&!st.del&&st.list)||[]).forEach(function(t,i){CATS[t.k]={n:t.n,c:PAL[i%PAL.length]}});KEYS=Object.keys(CATS)}
function addTag(name){
  name=(name||"").trim().slice(0,20);if(!name)return;
  var low=name.toLowerCase(),dup=Object.keys(CATS).some(function(k){return CATS[k].n.toLowerCase()===low});
  if(dup){alert("Tag này đã có rồi.");return}
  var st=tagStore(),now=Date.now();
  if(!st){st={id:2,fin:1,k:"ctags",list:[],ts:now,upd:now};notes.push(st)}
  st.list=(st.list||[]).concat([{k:"c"+now,n:name}]);st.upd=now;
  save();render();sync();
  var f=document.getElementById("filters");f.scrollLeft=f.scrollWidth;
}
function delTag(k){
  var st=tagStore();if(!st||!confirm("Xóa tag "+(CATS[k]?CATS[k].n:"")+"? Các ghi chú trong tag sẽ chuyển sang Khác."))return;
  var now=Date.now();
  st.list=(st.list||[]).filter(function(t){return t.k!==k});st.upd=now;
  notes.forEach(function(x){if(!x.fin&&x.cat===k){x.cat="other";x.upd=now}});
  if(filter===k)filter="all";
  save();render();sync();
}
var TAGS={"#quanan":"food","#an":"food","#nho":"mem","#ytuong":"idea","#idea":"idea","#viec":"todo","#todo":"todo"};
var RULES={
food:["pho","bun","banh","com ","ca phe","cafe","coffee","tra ","lau","nuong","nha hang","bia","che ","xoi","mien","mi ","ga ","bo ","hai san","ngon","menu","buffet","kem","oc ","lau "],
mem:["nho","mat khau","password","pass","wifi","so dien thoai","sdt","ma ","sinh nhat","dia chi","tai khoan","size","stk","cccd","bien so"],
idea:["y tuong","idea","nen thu","du an","lam app","viet ","ke hoach","thu lam","sang kien","hay la"],
todo:["mua ","goi ","nhan ","gui ","dong ","nop ","dat ","hen ","hop ","deadline","thanh toan","sua ","tra tien","di kham","can lam","phai "]};
var AREAS={"hai ba trung":"Hai Bà Trưng","hoan kiem":"Hoàn Kiếm","dong da":"Đống Đa","ba dinh":"Ba Đình","cau giay":"Cầu Giấy","thanh xuan":"Thanh Xuân","hoang mai":"Hoàng Mai","tay ho":"Tây Hồ","long bien":"Long Biên","ha dong":"Hà Đông","nam tu liem":"Nam Từ Liêm","bac tu liem":"Bắc Từ Liêm","pho co":"Phố Cổ","trung kinh":"Trung Kính","kim ma":"Kim Mã","giang vo":"Giảng Võ","tay son":"Tây Sơn","xuan thuy":"Xuân Thủy"};
var notes=[],filter="all",query="",DB="https://note-everything-65971-default-rtdb.asia-southeast1.firebasedatabase.app",code="",busy=false,again=false;
function vis(){return notes.filter(function(x){return !x.del&&!x.fin})}
function norm(s){return " "+s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d")+" "}
var STRICT={food:["quán","tiệm"]};
var DISH=["pho","bun","banh","com","lau","nuong","che","xoi","mien","mi","ga","bo","hai san","oc","kem","tra","bia","ngon"];
RULES.food=["nha hang","buffet","cafe","coffee","ca phe","quan an"];
function classify(t){
  var low=t.toLowerCase(),m=low.match(/#[a-z]+/g)||[];
  for(var i=0;i<m.length;i++)if(TAGS[m[i]])return TAGS[m[i]];
  var s=" "+norm(t).replace(/[^a-z0-9]+/g," ")+" ",d=" "+t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ")+" ",best="other",top=0;
  KEYS.forEach(function(k){var n=0;(RULES[k]||[]).forEach(function(w){if(s.indexOf(" "+w.trim()+" ")>-1)n++});(STRICT[k]||[]).forEach(function(w){if(d.indexOf(" "+w+" ")>-1)n++});if(n>top){top=n;best=k}});
  if(best==="other"&&area(t)&&DISH.some(function(w){return s.indexOf(" "+w+" ")>-1}))best="food";
  return best;
}
function area(t){var s=norm(t);for(var k in AREAS)if(s.indexOf(k)>-1)return AREAS[k];return ""}
function mapLink(x){
  var m=x.text.match(/https?:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)[^\s]*/i);
  if(x.link)return{u:x.link,l:"Mở bản đồ"};
  if(m)return{u:m[0],l:"Mở bản đồ"};
  if(x.cat==="food"||x.area)return{u:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x.text.slice(0,120)+" "+(x.area||"")+" Hà Nội"),l:"Tìm trên bản đồ"};
  return null;
}
function clean(t){return t.replace(/#(quanan|an|nho|ytuong|idea|viec|todo)\b/gi,"").replace(/[ \t]+/g," ").replace(/ *\n */g,"\n").replace(/\n{3,}/g,"\n\n").trim()||t}
var openId=null,expanded={};
function picker(x){return '<div class="pick">'+KEYS.map(function(k){var c=CATS[k];return '<button class="tag" data-set="'+k+'" data-id="'+x.id+'" aria-pressed="'+(x.cat===k)+'" style="background:var(--c-'+c.c+'-bg);color:var(--c-'+c.c+')">'+c.n+'</button>'}).join('')+'</div>'}
var pending=null,MAPRE=/https?:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)[^\s]*/i;
function attach(id,txt){
  var m=(txt||"").match(MAPRE),n=notes.find(function(x){return x.id==id});
  if(m&&n){n.link=m[0];n.upd=Date.now();if(pending==id)pending=null;save();render();sync();return true}
  return false;
}
function pasteInto(id,manual){
  function ask(){var v=prompt("Dán link Google Maps vào đây");if(v&&!attach(id,v))alert("Đây không phải link Google Maps.")}
  try{navigator.clipboard.readText().then(function(t){if(!attach(id,t)&&manual)ask()},function(){if(manual)ask()})}catch(e){if(manual)ask()}
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')}
function load(){try{var r=localStorage.getItem("ghichu");if(r)notes=JSON.parse(r)||[]}catch(e){notes=[]}}
function save(){try{localStorage.setItem("ghichu",JSON.stringify(notes))}catch(e){}}
function fmt(ts){var d=new Date(ts);return d.getDate()+"/"+(d.getMonth()+1)+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function strongAmt(tok){
  var t=norm(tok).trim().replace(/^[+\-=]/,"").replace(/[;:!?]+$/,"").replace(/[.,]+$/,""),sg=/^[+\-=]/.test(tok.trim()),p,u;
  if(/^\d+(?:[.,]\d+)?(k|tr|trieu|nghin|ngan)(\d{1,3})?$/.test(t)||/^\d+(d|dong)$/.test(t)){p=parseTok(t);return p?p.v:0}
  u=t.replace(/(d|dong)$/,"");
  if(/^\d{1,3}([.,]\d{3})+$/.test(u)){p=parseTok(u);return p?p.v:0}
  if(sg&&/^\d+$/.test(t)){p=parseTok(t);return p?p.v:0}
  return 0;
}
function bare(w){return norm(w).trim().replace(/[^a-z0-9]/g,"")}
function autoFin(raw){
  if(raw.indexOf("\n")>-1||raw.length>80||/https?:\/\//i.test(raw)||raw.indexOf("#")>-1||area(raw))return null;
  var tk=raw.trim().split(/\s+/),idx=-1,v=0,i;
  for(i=0;i<tk.length;i++){v=strongAmt(tk[i]);if(v){idx=i;break}}
  if(idx<0&&tk.some(function(w){var b=bare(w);return b==="no"||b==="vay"||b==="muon"})){
    for(i=0;i<tk.length;i++){var tn=tk[i].replace(/[;:!?]+$/,"");if(/^\d+([.,]\d{3})*$/.test(tn)){var nv=Number(tn.replace(/[.,]/g,""));if(nv>=1000){v=nv;idx=i;break}}}
  }
  if(idx<0)return null;
  var tok=tk[idx],prev=idx>0?tk[idx-1]:"",c0=tok.charAt(0);
  var sign=(c0==="+"||prev==="+")?"+":((c0==="-"||prev==="-")?"-":"");
  var rest=tk.filter(function(_,j){return j!==idx&&!(j===idx-1&&(prev==="+"||prev==="-"))});
  var words=rest.map(bare).filter(Boolean),now=Date.now(),day=today();
  var isDebt=words.some(function(w){return w==="no"||w==="vay"||w==="muon"});

  var W=600,H=110,T=14,G=10,sw=(W-(wk.length-1)*G)/days,bw=sw*.4,x=0,s;
  s='<svg viewBox="0 0 '+W+' '+(T+H+84)+'" width="100%" role="img" aria-label="Thu chi theo ngày, nhóm theo tuần">';
  s+='<line x1="0" x2="'+W+'" y1="'+(T+H)+'" y2="'+(T+H)+'" style="stroke:var(--line)"/>';
  wk.forEach(function(w,j){
    var n=w[1]-w[0]+1,gw=n*sw,ti=0,to=0,d;
    for(d=w[0];d<=w[1];d++){
      var cx=x+(d-w[0])*sw+(sw-2*bw-1)/2;
      ti+=di[d];to+=dout[d];
      var ds=mkey(ym.y,ym.m)+"-"+p2(d),sel=fday===ds;
      s+='<g data-fday="'+ds+'" style="cursor:pointer"><rect x="'+(x+(d-w[0])*sw).toFixed(1)+'" y="0" width="'+sw.toFixed(1)+'" height="'+(T+H+20)+'" rx="3" style="fill:'+(sel?'var(--bg)':'transparent')+(sel?';stroke:var(--accent)':'')+'"/>';
      s+='<text x="'+(cx+bw+.5).toFixed(1)+'" y="'+(T+H+14)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">'+d+'</text>';
      [[di[d],"var(--good)","Thu"],[dout[d],"var(--bad)","Chi"]].forEach(function(p,q){
        var h=p[0]?Math.max(3,p[0]/mx*H):0;
        if(h)s+='<rect x="'+(cx+q*(bw+1)).toFixed(1)+'" y="'+(T+H-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5" style="fill:'+p[1]+'"><title>Ngày '+d+' · '+p[2]+': '+money(p[0])+'</title></rect>';
      });
      s+='</g>';
    }
    var mid=(x+gw/2).toFixed(1);
    s+='<line x1="'+(x+2).toFixed(1)+'" x2="'+(x+gw-2).toFixed(1)+'" y1="'+(T+H+24)+'" y2="'+(T+H+24)+'" style="stroke:var(--muted)" stroke-width="1.5"/>';
    s+='<text x="'+mid+'" y="'+(T+H+42)+'" text-anchor="middle" font-size="14" style="fill:var(--ink);font-weight:600">Tuần '+(j+1)+'</text>';
    if(to)s+='<text x="'+mid+'" y="'+(T+H+60)+'" text-anchor="middle" font-size="14" style="fill:var(--bad)">-'+cmp(to)+'</text>';
    if(ti)s+='<text x="'+mid+'" y="'+(T+H+78)+'" text-anchor="middle" font-size="14" style="fill:var(--good)">+'+cmp(ti)+'</text>';
    x+=gw+G;
  });
  return s+'</svg>';
}
function trendChart(){
  if(trendN===1)return weekChart();
  var W=600,H=110,T=22,arr=[],i,y=ym.y,m=ym.m,mx=0,s;
  for(i=0;i<trendN;i++){arr.unshift({y:y,m:m,s:monthSum(y,m)});m--;if(m<1){m=12;y--}}
  arr.forEach(function(a){mx=Math.max(mx,a.s["in"],a.s["out"])});
  if(!mx)return"";
  var gw=W/trendN,bw=Math.min(gw*.32,64);
  s='<svg viewBox="0 0 '+W+' '+(T+H+28)+'" width="100%" role="img" aria-label="Thu chi theo tháng">';
  arr.forEach(function(a,j){
    var x0=j*gw+(gw-(2*bw+4))/2;
    [["in","var(--good)","Thu"],["out","var(--bad)","Chi"]].forEach(function(p,q){
      var v=a.s[p[0]],h=v?Math.max(3,v/mx*H):0,x=x0+q*(bw+4);
      s+='<rect x="'+x.toFixed(1)+'" y="'+(T+H-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" style="fill:'+p[1]+'"><title>'+p[2]+' T'+a.m+'/'+a.y+': '+money(v)+'</title></rect>';
      if(v&&trendN<=6)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(T+H-h-5).toFixed(1)+'" text-anchor="middle" font-size="13" style="fill:var(--muted)">'+cmp(v)+'</text>';
    });
    s+='<text x="'+(j*gw+gw/2).toFixed(1)+'" y="'+(T+H+20)+'" text-anchor="middle" font-size="16" style="fill:var(--muted)">T'+a.m+'</text>';
  });
  return s+'<line x1="0" x2="'+W+'" y1="'+(T+H)+'" y2="'+(T+H)+'" style="stroke:var(--line)"/></svg>';
}
function pickerFin(x){var l=x.t==="in"?INC:OUT;return'<div class="pick">'+l.map(function(c,i){var col=x.t==="in"?"var(--good)":"var(--k"+i+")";return'<button class="tag ftag" data-fset="'+c.k+'" data-id="'+x.id+'" aria-pressed="'+(x.cat===c.k)+'" style="color:'+col+';background:transparent;border:1px solid currentColor">'+c.n+'</button>'}).join("")+'</div>'}
function renderTx(top,body){
  var key=mkey(ym.y,ym.m),ms=monthSum(ym.y,ym.m),bl=balance(),days=new Date(ym.y,ym.m,0).getDate();
  var all=fins().filter(function(x){return x.k==="tx"&&x.day&&x.day.indexOf(key)===0});
  var dOwe=0,dLent=0;fins().forEach(function(x){if(x.k==="debt"){var r=Math.max(0,x.amt-(x.paid||0));if(x.dir==="owe")dOwe+=r;else dLent+=r}});
  top.innerHTML='<div class="mnav"><button data-mo="-1" aria-label="Tháng trước">‹</button><b>Tháng '+ym.m+'/'+ym.y+'</b><button data-mo="1" aria-label="Tháng sau">›</button></div>'+
   '<div class="wallet"><button class="plus" data-add="1" aria-label="Thêm khoản thu chi">+</button><div class="hint">Tổng ví</div><div class="big'+(bl.b<0?' neg':'')+'">'+(bl.b<0?"-":"")+money(bl.b)+'</div><div class="two"><div><span class="hint">Thu tháng này</span><b class="good">+'+money(ms["in"])+'</b></div><div><span class="hint">Chi tháng này</span><b class="bad">-'+money(ms["out"])+'</b></div></div><div class="two" style="margin-top:10px"><div><span class="hint">Mình đang nợ</span><b class="bad">'+money(dOwe)+'</b></div><div><span class="hint">Họ đang nợ mình</span><b class="good">'+money(dLent)+'</b></div></div><button class="lnk" data-open="1">'+(bl.o?"Sửa số dư ban đầu ("+money(bl.o)+")":"Đặt số dư ban đầu")+'</button></div>';
  var h="",by={},cs={},tot=0;
  all.forEach(function(x){if(x.t==="out"){by[+x.day.slice(8)]=(by[+x.day.slice(8)]||0)+x.amt;cs[x.cat]=(cs[x.cat]||0)+x.amt;tot+=x.amt}});
  var views={};
  if(tot){
    views.day=dailyChart(by,days);
    var rows=OUT.map(function(c,i){return{k:c.k,n:c.n,i:i,v:cs[c.k]||0}}).filter(function(r){return r.v>0}).sort(function(a,b){return b.v-a.v});
    views.cat='<div class="hint" style="margin:0 0 6px">Bấm một mục để lọc danh sách bên dưới</div>'+rows.map(function(r){return'<button class="crow" data-fcat="'+r.k+'" aria-pressed="'+(fcat===r.k)+'"><span>'+r.n+'</span><span class="cbar"><i style="width:'+Math.max(2,Math.round(r.v/tot*100))+'%;background:var(--k'+r.i+')"></i></span><span class="cv">'+money(r.v)+' · '+Math.round(r.v/tot*100)+'%</span></button>'}).join("");
  }
  if(fday)views.day=hourChart(all.filter(function(x){return x.day===fday}));
  var tr=trendChart();
  if(tr)views.trend='<div class="hint" style="margin:0 0 6px"><span class="good">■ Thu</span> <span class="bad">■ Chi</span></div>'+tr;
  var avail=[["day",fday?dayLabel(fday):"Theo ngày"],["cat","Theo mục"],["trend",trendN+" tháng"]].filter(function(a){return views[a[0]]});
  if(avail.length){
    if(!views[chartView])chartView=avail[0][0];
    h+='<div class="card"><div class="cvt">'+avail.map(function(a){return'<button class="chip" data-cv="'+a[0]+'" aria-pressed="'+(chartView===a[0])+'">'+a[1]+'</button>'}).join("")+'</div>'+views[chartView]+'</div>';
  }
  var items=all.filter(function(x){return(!fcat||(x.t==="out"&&x.cat===fcat))&&(!fday||x.day===fday)});
  h+='<div class="fdrow"><label class="hint" for="fd-pick">Xem chi tiết ngày</label><input type="date" id="fd-pick" class="date" data-fdpick="1" value="'+esc(fday)+'"></div>';
  if(fday){
    var di=0,dout=0;all.forEach(function(x){if(x.day===fday){if(x.t==="in")di+=x.amt;else dout+=x.amt}});
    h+='<div class="dsum"><b>'+dayLabel(fday)+'</b><span class="bad">Chi '+money(dout)+'</span><span class="good">Thu '+money(di)+'</span><button class="lnk" data-fclear="1">Xem cả tháng</button></div>';
  }
  if(fcat)h+='<div class="hint" style="margin:0 2px 4px">Đang lọc mục '+esc((OUT.filter(function(c){return c.k===fcat})[0]||{n:""}).n)+'. Bấm lại mục đó để bỏ lọc.</div>';
  if(!items.length){h+='<div class="empty">'+(all.length?"Không có giao dịch nào khớp.":"Tháng này chưa có giao dịch. Bấm nút + để thêm.")+'</div>'}
  else{
    var g={};items.forEach(function(x){(g[x.day]=g[x.day]||[]).push(x)});
    Object.keys(g).sort().reverse().forEach(function(day){
      var arr=g[day].sort(function(a,b){return b.ts-a.ts}),ds=0;
      arr.forEach(function(x){if(x.t==="out")ds+=x.amt});
      h+='<div class="dh"><span>'+dayLabel(day)+'</span><span>'+(ds?"Chi "+money(ds):"")+'</span></div>';
      arr.forEach(function(x){
        if(editing==x.id){h+='<div class="tx" style="display:block">'+editForm(x)+'</div>';return}
        h+='<div class="tx"><div><div class="tdesc">'+esc(x.desc||"")+'</div><button class="tag ftag" data-ftx="'+x.id+'" title="Bấm để đổi mục" style="color:'+catColor(x)+'">'+catName(x)+'</button></div><div class="tamt '+(x.t==="in"?"good":"bad")+'">'+(x.t==="in"?"+":"-")+money(x.amt)+'</div><button class="ebtn" data-edit="'+x.id+'" aria-label="Sửa giao dịch">Sửa</button><button class="del" data-fdel="'+x.id+'" aria-label="Xóa giao dịch">Xóa</button>'+(openTx==x.id?pickerFin(x):'')+'</div>';
      });
    });
  }
  body.innerHTML=h;
}
function renderDebt(top,body){
  var ds=fins().filter(function(x){return x.k==="debt"}),owe=0,lent=0;
  ds.forEach(function(x){var r=Math.max(0,x.amt-(x.paid||0));if(x.dir==="owe")owe+=r;else lent+=r});
  top.innerHTML='<div class="wallet"><button class="plus" data-add="1" aria-label="Thêm khoản nợ">+</button><div class="two"><div><span class="hint">Mình đang nợ</span><b class="bad" style="font-size:22px">'+money(owe)+'</b></div><div><span class="hint">Họ đang nợ mình</span><b class="good" style="font-size:22px">'+money(lent)+'</b></div></div><div class="hint" style="margin-top:8px">Cho vay thì trừ khỏi Tổng ví, đi vay thì cộng vào. Khi thu hoặc trả lại thì Tổng ví hoàn lại tương ứng.</div></div>';
  ds.sort(function(a,b){var ad=a.amt-(a.paid||0)<=0,bd=b.amt-(b.paid||0)<=0;return ad!==bd?(ad?1:-1):b.ts-a.ts});
  if(!ds.length){body.innerHTML='<div class="empty">Chưa có khoản nợ nào.</div>';return}
  body.innerHTML=ds.map(function(x){
    var rem=Math.max(0,x.amt-(x.paid||0)),done=rem<=0,own=x.dir==="owe";if(editing==x.id)return'<div class="note">'+editForm(x)+'</div>';
    return'<div class="note'+(done?' done':'')+'"><div class="tdesc" style="word-break:break-word">'+esc(x.desc||"")+'</div>'+
    '<div class="meta"><span class="tag" style="background:transparent;border:1px solid currentColor;color:'+(own?"var(--bad)":"var(--good)")+'">'+(own?"Mình nợ":"Họ nợ mình")+'</span>'+
    '<b style="color:var(--ink)">'+(done?"Đã xong · "+money(x.amt):"Còn "+money(rem)+" / "+money(x.amt))+'</b><span>'+(x.day?dayLabel(x.day):"")+'</span></div>'+
    '<div class="meta">'+(done?'<button class="dtn" data-dreopen="'+x.id+'">Mở lại</button>':'<button class="dtn" data-dpay="'+x.id+'">'+(own?"Trả bớt":"Thu bớt")+'</button><button class="dtn" data-ddone="'+x.id+'">Đã xong</button>')+'<button class="ebtn" data-edit="'+x.id+'" aria-label="Sửa khoản nợ">Sửa</button><button class="del" data-ddel="'+x.id+'" aria-label="Xóa khoản nợ">Xóa</button></div></div>';
  }).join("");
}
function renderFin(){
  var top=document.getElementById("finTop"),body=document.getElementById("finBody");
  Array.prototype.forEach.call(document.querySelectorAll("[data-sub]"),function(b){b.setAttribute("aria-pressed",b.dataset.sub===sub)});
  document.getElementById("fin-add").hidden=sub==="debt";
  document.getElementById("fin-debt").hidden=sub!=="debt";
  document.getElementById("fin-in").placeholder=sub==="debt"?"500k Nam tiền ăn":"45k phở bò · 1tr2 tiền điện · +15tr lương";
  if(sub==="debt")renderDebt(top,body);else renderTx(top,body);
}
function setTab(t){
  tab=t;try{localStorage.setItem("ghichu_tab",t)}catch(e){}
  document.getElementById("notesView").hidden=t!=="notes";
  document.getElementById("finView").hidden=t!=="fin";
  document.getElementById("copy").hidden=t!=="notes";
  Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"),function(b){b.setAttribute("aria-pressed",b.dataset.tab===t)});
  if(t==="fin")renderFin();
}
var editing=null,editVal="",editDay="",editDir="",editErr="";
function amtStr(n){if(n<1000)return n+"d";if(n%1e6===0)return n/1e6+"tr";if(n%1000===0)return n/1000+"k";return String(n)}
function editForm(x){
  var tx=x.fin&&x.k==="tx",debt=x.fin&&x.k==="debt",h='<div class="edit">';
  if(!x.fin)h+='<textarea class="ed" data-ef="1" rows="3" aria-label="Sửa ghi chú">'+esc(editVal)+'</textarea>';
  else h+='<input class="ed" data-ef="1" type="text" autocomplete="off" enterkeyhint="done" aria-label="Sửa" value="'+esc(editVal)+'">';
  if(debt)h+='<div class="meta"><button class="chip" data-edir="owe" aria-pressed="'+(editDir==="owe")+'">Mình nợ</button><button class="chip" data-edir="lent" aria-pressed="'+(editDir==="lent")+'">Họ nợ mình</button></div>';
  if(x.fin)h+='<div class="meta"><input type="date" class="date" data-ed="1" value="'+esc(editDay||"")+'" aria-label="Ngày">'+(tx?'<span>Thêm + đầu số nếu là khoản thu</span>':'')+'</div>';
  if(editErr)h+='<div class="meta bad">'+esc(editErr)+'</div>';
  return h+'<div class="meta"><button class="add sm" data-esave="'+x.id+'">Lưu</button><button class="add alt sm" data-ecancel="1">Hủy</button></div></div>';
}
function focusEdit(){setTimeout(function(){var f=document.querySelector("[data-ef]");if(f){f.focus();try{f.setSelectionRange(f.value.length,f.value.length)}catch(e){}}},0)}
function startEdit(id){
  var x=findFin(id);if(!x||x.del)return;
  editing=x.id;editErr="";openId=null;openTx=null;editDay=x.day||today();editDir=x.dir||"";
  if(!x.fin)editVal=x.text;
  else if(x.k==="tx")editVal=(x.t==="in"?"+":"")+amtStr(x.amt)+(x.desc?" "+x.desc:"");
  else editVal=amtStr(x.amt)+(x.desc&&x.desc!=="(không ghi chú)"?" "+x.desc:"");
  render();focusEdit();
}
function saveEdit(id){
  var x=findFin(id),r;
  if(!x||x.del){editing=null;render();return}
  editErr="";
  if(!x.fin){
    var raw=editVal.trim();
    if(!raw){editErr="Ghi chú không được để trống.";render();focusEdit();return}
    x.text=clean(raw);x.area=area(raw);if(x.cat==="other")x.cat=classify(raw);
  }else{
    r=parseLine(editVal);
    if(!r){editErr="Chưa thấy số tiền. Ví dụ: 45k phở bò";render();focusEdit();return}
    var day=editDay||x.day||today();
    if(x.k==="tx"){
      var inc=r.inc,chg=r.desc!==(x.desc||"")||(inc?"in":"out")!==x.t;
      x.t=inc?"in":"out";x.amt=r.amt;x.desc=r.desc;x.day=day;
      if(chg)x.cat=guessCat(r.desc,inc);
      if(!x.desc)x.desc=catName(x);
      var dd=day.split("-");ym={y:+dd[0],m:+dd[1]};fcat="";
    }else if(x.k==="debt"){
      x.dir=editDir||x.dir;x.amt=r.amt;x.desc=r.desc||"(không ghi chú)";x.day=day;x.paid=Math.min(x.paid||0,x.amt);
    }
  }
  x.upd=Date.now();editing=null;save();render();sync();
}
function render(){renderNotes();if(tab==="fin")renderFin()}
function findFin(id){return notes.find(function(x){return x.id==id})}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset,x;
  if(d.tab){setTab(d.tab);return}
  if(d.add){openSheet();return}
  if(d.sheetclose){closeSheet();return}
  if(d.fclear){fday="";renderFin();return}
  if(d.cv){if(d.cv==="trend"&&chartView==="trend"){trendN=trendN===1?3:trendN===3?6:trendN===6?12:1}chartView=d.cv;renderFin();return}
  if(d.sub){sub=d.sub;fcat="";fday="";openTx=null;defMsg();renderFin();return}
  if(d.mo){var mm=ym.m+Number(d.mo),yy=ym.y;if(mm<1){mm=12;yy--}if(mm>12){mm=1;yy++}ym={y:yy,m:mm};fcat="";fday="";openTx=null;renderFin();return}
  if(d.fcat){fcat=fcat===d.fcat?"":d.fcat;renderFin();return}
  if(d.ftx){openTx=openTx==d.ftx?null:d.ftx;renderFin();return}
  if(d.fset){x=findFin(d.id);if(x){x.cat=d.fset;x.upd=Date.now();openTx=null;touch()}return}
  if(d.fdel){x=findFin(d.fdel);if(x){x.del=true;x.desc="";x.amt=0;x.upd=Date.now();touch()}return}
  if(d.open){
    var cur=findFin(1),v=prompt("Số dư ban đầu của ví (ví dụ 5tr, 2tr300). Nhập 0 để bỏ.",cur&&!cur.del&&cur.amt?String(cur.amt):"");
    if(v===null)return;
    var amt=v.trim()==="0"?0:(parseLine(v)||{}).amt;
    if(amt===undefined){setMsg("Số dư chưa đọc được.");return}
    if(!cur){cur={id:1,fin:1,k:"open",ts:1};notes.push(cur)}
    cur.amt=amt;cur.del=false;cur.upd=Date.now();touch();return;
  }
  if(d.dir){addFin(d.dir);return}
  if(d.dpay){x=findFin(d.dpay);if(x){var v2=prompt("Số tiền "+(x.dir==="owe"?"đã trả":"đã thu")+" (ví dụ 200k):");if(v2){var r=parseLine(v2);if(r){x.paid=Math.min(x.amt,(x.paid||0)+r.amt);x.upd=Date.now();touch()}else alert("Chưa đọc được số tiền.")}}return}
  if(d.ddone){x=findFin(d.ddone);if(x){x.paid=x.amt;x.upd=Date.now();touch()}return}
  if(d.dreopen){x=findFin(d.dreopen);if(x){x.paid=0;x.upd=Date.now();touch()}return}
  if(d.ddel){x=findFin(d.ddel);if(x){x.del=true;x.desc="";x.amt=0;x.paid=0;x.upd=Date.now();touch()}return}
});
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.edit){startEdit(d.edit);return}
  if(d.ecancel){editing=null;editErr="";render();return}
  if(d.esave){saveEdit(d.esave);return}
  if(d.edir){editDir=d.edir;render();return}
});
document.addEventListener("input",function(e){var t=e.target;if(!t.dataset)return;if(t.dataset.ef)editVal=t.value;else if(t.dataset.ed)editDay=t.value});
document.addEventListener("keydown",function(e){var t=e.target;if(!t.dataset||!t.dataset.ef)return;if(e.key==="Escape"){editing=null;editErr="";render()}else if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();saveEdit(editing)}});
document.getElementById("fin-add").onclick=function(){addFin()};
document.addEventListener("click",function(e){
  var g=e.target.closest&&e.target.closest("[data-fday]");
  if(!g||g.tagName==="BUTTON")return;
  fday=fday===g.getAttribute("data-fday")?"":g.getAttribute("data-fday");renderFin();
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.fdpick)return;
  if(t.value){var p=t.value.split("-");ym={y:+p[0],m:+p[1]};fday=t.value;fcat=""}else fday="";
  renderFin();
});
document.getElementById("finSheet").addEventListener("mousedown",function(e){if(e.target===this)closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!document.getElementById("finSheet").hidden)closeSheet()});
document.getElementById("fin-in").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addFin()}});
document.getElementById("fin-date").value=today();
defMsg();
load();
try{code=localStorage.getItem("ghichu_code")||""}catch(e){}
document.getElementById("code").value=code;
setSt(code?"":"Chưa bật đồng bộ");
setTab(tab);render();
if(code)sync();
