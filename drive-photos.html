<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f6b5c">
<title>Arknights Log · NoteEverything</title>
<style>
:root{--bg:#eef2f0;--sf:#fff;--ink:#14231e;--mu:#5d6f68;--ln:#d5ddd9;--ac:#0f6b5c;--acs:#dff1ec;--bad:#c0392b;--bads:#fbe3e0;--warn:#b7791f;--warns:#fdf0d5}
@media(prefers-color-scheme:dark){:root{--bg:#0e1714;--sf:#172420;--ink:#e6f0ec;--mu:#93a9a1;--ln:#2a3b36;--ac:#4fd1b5;--acs:#1c3a33;--bad:#ff8a7a;--bads:#3b2326;--warn:#f2c14e;--warns:#3a3220;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
html,body{overscroll-behavior-y:contain}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px}
.wrap{max-width:560px;margin:0 auto}
.back{color:var(--ac);text-decoration:none;font-size:13px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:19px}
.acts{display:flex;gap:4px}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--mu)}
.ib:hover{background:var(--ln)}.ib[aria-pressed=true]{color:var(--ac)}.ib svg{width:22px;height:22px}
.ib:focus-visible,.go:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu);font-size:12px}
#sub{min-height:18px}
#cfgp{max-width:560px;margin:10px auto 0;padding:0 14px}
#cfgp .box{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px}
#cfgp label{display:block;font-size:13px;margin:8px 0 4px}
#cfgp input{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:12px;padding:9px 12px}
.go{margin-top:12px;border:0;background:var(--ac);color:var(--bg);border-radius:999px;padding:9px 18px;font-weight:600}
.lnk{background:none;border:0;color:var(--ac);padding:9px 8px;margin-top:12px}
#feed{max-width:560px;margin:0 auto;padding:6px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.day{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 8px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.ok{background:var(--acs);color:var(--ac)}.pill.bad{background:var(--bads);color:var(--bad)}.pill.miss{background:var(--warns);color:var(--warn)}.pill.pend{background:var(--ln);color:var(--mu)}
img.t{display:block;width:100%;height:auto;min-height:110px;object-fit:contain;border-radius:10px;cursor:zoom-in;background:var(--ln)}
.row{display:flex;gap:8px;margin:8px 0;align-items:flex-end}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--bg);display:grid;place-items:center;font-size:14px}
.bub{background:var(--sf);border:1px solid var(--ln);border-radius:16px 16px 16px 4px;padding:8px;max-width:calc(100% - 40px);min-width:0}
.bub .tx{padding:2px 4px 6px;font-size:14px}.bub .tm{padding:4px 4px 0;text-align:right}
.bub.dash{border-style:dashed;background:transparent;color:var(--mu)}
.tl{margin-left:10px;padding-left:20px;border-left:2px solid var(--ln)}
.it{position:relative;margin:0 0 12px}
.it::before{content:"";position:absolute;left:-28px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:3px solid var(--bg)}
.it.bad::before{background:var(--bad)}.it.miss::before{background:var(--warn)}.it.pend::before{background:var(--bg);border:2px solid var(--ln)}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px;font-size:14px}
.card{display:flex;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px;align-items:center}
.card img.t{width:96px;min-height:0;aspect-ratio:5/3;flex:none;border-radius:8px}
.card p{margin:0;font-size:13px;min-width:0}.card .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.lb img{max-width:100%;max-height:78vh;border-radius:10px;object-fit:contain}
.lb p{color:#fff;margin:0;font-size:12px;text-align:center;overflow-wrap:anywhere}.lb a{color:#fff;font-size:13px}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px}
.why{margin:2px 4px 8px;padding:0;list-style:none;font-size:13px}.why li{margin:3px 0;padding-left:16px;position:relative}.why li::before{content:"⚠";position:absolute;left:0;color:var(--bad);font-size:11px;top:2px}.why li.w::before{color:var(--warn)}.why li.n{color:var(--mu)}.why li.n::before{content:"•"}
@media(prefers-reduced-motion:no-preference){.sp{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
dialog#viewer{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;overflow:hidden;color:#fff}
dialog#viewer[open]{display:flex;align-items:center;justify-content:center}
dialog#viewer::backdrop{background:rgba(0,0,0,.92)}
#original{display:block;max-width:100vw;max-height:84vh;max-height:84dvh;margin:0 0 14vh;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform}
#photo-status{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;margin:0;pointer-events:none}
#photo-status:empty{display:none}
#more{display:block;margin:10px auto;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 16px}
button:disabled{opacity:.5;cursor:default}
.log-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.log-action{border:1px solid var(--ln);border-radius:8px;background:var(--sf);padding:4px 9px}
#stability{max-width:560px;margin:10px auto;padding:0 14px}
.chart-row{display:grid;grid-template-columns:3em 1fr;gap:6px;align-items:center;margin:8px 0}
.chart-bar{height:10px;display:flex;overflow:hidden;border-radius:6px;background:var(--ln)}
.chart-bar .ok{background:var(--ac)}.chart-bar .bad{background:var(--bad)}.chart-bar .miss{background:var(--warn)}
.photo-actions{display:flex;justify-content:flex-end;gap:8px;align-items:center;padding-top:4px}
#remove-photo{width:min(440px,calc(100% - 28px));border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--ink)}
#remove-photo::backdrop{background:#0009}
#remove-photo select{width:100%;font:inherit}
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <a class="back" href="./index.html">← NoteEverything</a>
  <div class="hrow"><h1>Arknights Log</h1>
    <div class="acts">
      <button class="ib" id="rf" type="button" aria-label="Làm mới" title="Làm mới"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>
      <button class="ib" id="cf" type="button" aria-label="Thư mục và đăng nhập" title="Thư mục và đăng nhập"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <button class="ib" id="md" type="button" aria-pressed="false"></button>
    </div>
  </div>
  <div id="status" class="mu" role="status">Đang tải đăng nhập Google…</div>
  <div class="log-tools"><button class="log-action" id="stability-toggle" type="button" aria-expanded="false" aria-controls="stability">Ổn định</button><span class="mu" id="quota"></span></div>
</div></div>
<section id="stability" hidden aria-label="Biểu đồ độ ổn định"></section>
<section id="cfgp"><div class="box">
  <form id="connect">
    <label for="client">Google OAuth Client ID</label>
    <input id="client" required autocomplete="off" placeholder="…apps.googleusercontent.com">
    <label for="folder">Link hoặc mã thư mục Drive</label>
    <input id="folder" required autocomplete="off" placeholder="https://drive.google.com/drive/folders/…">
    <button class="go" id="authorize" disabled>Mở thư mục</button>
  </form>
</div></section>
<main id="feed" aria-live="polite"></main>
<dialog id="remove-photo" aria-labelledby="remove-title">
  <form id="remove-form">
    <h2 id="remove-title">Xóa ảnh</h2>
    <p id="remove-name" class="mu"></p>
    <label for="remove-mode">Cách xóa</label>
    <select id="remove-mode">
      <option value="archive" selected>Xóa vĩnh viễn ảnh, giữ thông tin ca</option>
      <option value="delete">Xóa vĩnh viễn ảnh và thông tin ca</option>
      <option value="trash">Chuyển vào Thùng rác</option>
    </select>
    <p id="remove-status" class="mu" role="status"></p>
    <div class="photo-actions"><button class="log-action" id="remove-cancel" type="button">Hủy</button><button class="log-action" id="remove-confirm" type="submit">Xóa vĩnh viễn</button></div>
  </form>
</dialog>
<dialog id="viewer" aria-label="Ảnh gốc">
  <img id="original" alt="" draggable="false">
  <p id="photo-status" role="status" class="mu"></p>
</dialog>
<script>
const byId=id=>document.getElementById(id);
const form=byId('connect'),client=byId('client'),folder=byId('folder'),authorize=byId('authorize'),stat=byId('status'),feed=byId('feed');
const viewer=byId('viewer'),original=byId('original'),photoStatus=byId('photo-status');
const scope='https://www.googleapis.com/auth/drive.readonly',writeScope='https://www.googleapis.com/auth/drive',driveApi='https://www.googleapis.com/drive/v3';
const SL=[0,5,8,13,16,21],GRACE=30*6e4,TOL=90*6e4,DAYS=14;
let accessToken='',tokenClientId='',tokenExpiresAt=0,canWrite=false,settingsUrl='',syncedSettings='',folderId='',nextPage='',loadingMore=false,viewToken=0;
const S={mode:'chat',files:new Map(),map:{},imgs:{}};
const recordKey='arknightsOriginal';
const recordType='application/vnd.noteeverything.arknights-log-record';
try{
  client.value=localStorage.getItem('drivePhotosClient')||'';
  folder.value=localStorage.getItem('drivePhotosFolder')||'';
  S.mode=localStorage.getItem('drivePhotosMode')==='tl'?'tl':'chat';
  const syncCode=localStorage.getItem('ghichu_code')||'';
  if(/^[\w-]{8,}$/.test(syncCode))settingsUrl='https://note-everything-65971-default-rtdb.asia-southeast1.firebasedatabase.app/ghichu/'+encodeURIComponent(syncCode)+'/drivePhotos.json';
}catch{}
const p2=n=>('0'+n).slice(-2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseFolder(value){
  const input=value.trim();
  const link=/^https:\/\/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)(?:[/?#]|$)/i.exec(input);
  return link?.[1]||(/^[\w-]+$/.test(input)?input:'');
}
async function loadSettings(){
  if(!settingsUrl)return false;
  const response=await fetch(settingsUrl,{cache:'no-store',signal:AbortSignal.timeout(5000)});
  if(!response.ok)throw new Error('Không đọc được cấu hình đồng bộ.');
  const value=await response.json();
  if(typeof value!=='string')return false;
  const [clientId,fid]=value.split(' ');
  if(!/^[\w-]+\.apps\.googleusercontent\.com$/.test(clientId)||!/^[\w-]+$/.test(fid))return false;
  client.value=clientId;folder.value=fid;syncedSettings=value;return true;
}
async function saveSettings(clientId,fid){
  const value=clientId+' '+fid;
  if(!settingsUrl||syncedSettings===value)return;
  try{
    const response=await fetch(settingsUrl,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(value),signal:AbortSignal.timeout(5000)});
    if(!response.ok)throw new Error('Không lưu được cấu hình.');
    syncedSettings=value;
  }catch{stat.textContent+=' Chưa lưu được cấu hình cho các máy khác.'}
}
async function drive(path,params,options={}){
  const requestToken=accessToken;
  const {method='GET',body}=options;
  const headers={Authorization:'Bearer '+requestToken};
  if(body)headers['Content-Type']='application/json';
  const response=await fetch(driveApi+path+'?'+new URLSearchParams(params),{method,headers,cache:'no-store',body:body&&JSON.stringify(body)});
  if(response.status===401){
    if(accessToken===requestToken){
      accessToken='';tokenExpiresAt=0;canWrite=false;
      try{localStorage.removeItem('drivePhotosTok')}catch{}
      showReconnect();
    }
    throw new Error('Phiên Google đã hết hạn. Bấm Mở thư mục để kết nối lại.');
  }
  if(response.status===403)throw new Error('Google từ chối truy cập. Kiểm tra Drive API và quyền của tài khoản.');
  if(response.status===404)throw new Error('Tệp hoặc thư mục không còn truy cập được.');
  if(!response.ok)throw new Error('Không đọc được dữ liệu từ Drive ('+response.status+').');
  return response;
}
/* Tên file ghep_YYYYMMDD_HHMMSS_MUC_uuid.png -> giờ + mức. Mỗi ảnh vào khung giờ gần nhất (lệch tối đa 90 phút, kể cả qua nửa đêm) */
const ROOMN=r=>({F:'Factory ',T:'Trading Post '}[r[0]]||'')+r.slice(1),MISSN={CC:'Control Center',FAC:'Factory',TRADE:'Trading Post',P2:'Power Plant 2',HR:'HR'};
/* Tên file: ghep_YYYYMMDD_HHMMSS_[THIEUANH_][CANHBAO_][SAIDOIHINH_][mã chi tiết_…][uuid].png. Mã chi tiết do app ghép ảnh ghi: MORALE-SHAMARE-59, DIS-F2-Weedy, ROOMWARN-T1, STOPPED, MISS-FAC, LINEUP-F3 */
function details(tk){const d=[];
  tk.forEach(t=>{const a=t.split('-');let m;
    if(a[0]==='MORALE'&&a.length>=3)d.push({c:'b',t:a[1]+' morale '+(a[2]==='LE25'?'≤25%':a[2]+'%')+' (dưới mốc cảnh báo)'});
    else if(a[0]==='DIS'&&a.length>=3)d.push({c:'b',t:ROOMN(a[1])+': '+a[2]+' Distracted (hết morale)'});
    else if(a[0]==='ROOMWARN')d.push({c:'b',t:ROOMN(a[1])+': có dấu ⚠ (phòng có vấn đề)'});
    else if(t==='STOPPED')d.push({c:'b',t:'Có phòng Stopped (dừng hoạt động)'});
    else if(a[0]==='MISS'&&MISSN[a[1]])d.push({c:'w',t:'Thiếu ảnh '+MISSN[a[1]]});
    else if(a[0]==='LINEUP')d.push({c:'w',t:ROOMN(a[1])+': sai operator so với đội hình (xem chi tiết trong ảnh)'})});
  const up=tk.map(x=>x.toUpperCase());
  if(up.includes('THIEUANH')&&!d.some(x=>/^Thiếu ảnh/.test(x.t)))d.push({c:'w',t:'Thiếu ảnh khi ghép'});
  if(up.includes('SAIDOIHINH')&&!d.some(x=>/sai operator/.test(x.t)))d.push({c:'w',t:'Sai đội hình (xem chi tiết trong ảnh)'});
  if(up.includes('CANHBAO')&&!d.some(x=>x.c==='b'))d.push({c:'b',t:'Có cảnh báo, chưa có mã chi tiết — xem trong ảnh'});
  return d}
function parse(f){const m=/^ghep_(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)(\d\d)((?:_[^_.]+)*)/.exec(f.name);if(!m)return null;
  const tk=m[7].split('_').filter(x=>x&&!/^[0-9a-f]{8}-[0-9a-f-]+$/i.test(x)),up=tk.map(x=>x.toUpperCase()),
    d=details(tk),bad=d.length>0||up.some(x=>x==='CANHBAO'||x==='THIEUANH'||x==='SAIDOIHINH');
  return{f,ts:new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime(),bad,d}}
const why=e=>e.p&&e.p.d.length?'<ul class="why">'+e.p.d.map(x=>'<li class="'+x.c+'">'+esc(x.t)+'</li>').join('')+'</ul>':'';
/* Khung cố định giữ nhãn HH:00; khi có ảnh thì nhãn đổi thành giờ thực của ảnh (lấy từ tên file) */
const hms=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const hm=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
function build(files,now){
  const originals=new Set(files.filter(f=>!f.properties?.[recordKey]).map(f=>f.id)),records=new Set();
  const P=files.filter(f=>{const id=f.properties?.[recordKey];if(!id)return true;
    if(originals.has(id)||records.has(id))return false;records.add(id);return true
  }).map(parse).filter(Boolean).sort((a,b)=>a.ts-b.ts),slots={},extra=[],E=[];
  P.forEach(p=>{let best=null;const d=new Date(p.ts);
    for(let o=-1;o<=1;o++)SL.forEach(h=>{const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()+o,h).getTime(),df=Math.abs(p.ts-t);if(df<=TOL&&(!best||df<best.df))best={t,df}});
    if(best){const s=slots[best.t]||(slots[best.t]={n:0});s.p=p;s.n++}else extra.push(p)});
  const td=new Date(now),t0=new Date(td.getFullYear(),td.getMonth(),td.getDate());
  let cur=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()-(DAYS-1));
  if(P.length){const d0=new Date(P[0].ts);cur=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate())}
  while(cur<=t0){SL.forEach(h=>{const t=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate(),h).getTime(),s=slots[t];
      if(!s&&P.length&&t<P[0].ts-TOL)return;
      E.push({ts:t,label:s?hm(s.p.ts):p2(h)+':00',p:s?s.p:null,n:s?s.n:0,st:s?(s.p.bad?'bad':'ok'):(now>t+GRACE?'miss':'pend')})});
    cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1)}
  extra.forEach(p=>{const d=new Date(p.ts);E.push({ts:p.ts,label:hm(p.ts),p,n:1,st:p.bad?'bad':'ok'})});
  return E.sort((a,b)=>{const x=dayStart(a.ts),y=dayStart(b.ts);
    return x===y?a.ts-b.ts:x===+t0?-1:y===+t0?1:y-x})}
function dayStart(ts){const d=new Date(ts);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function dayLabel(ts){const d=new Date(ts),n=new Date(),k=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  return(k===0?'Hôm nay':k===1?'Hôm qua':['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][d.getDay()])+' · '+p2(d.getDate())+'/'+p2(d.getMonth()+1)}
const MSG={ok:'Đã ghép xong, không có bất thường',bad:'Có cảnh báo, hãy xem ảnh',miss:'Không nhận được ảnh ở khung này',pend:'Chưa tới giờ'},PT={ok:'Bình thường',bad:'Cảnh báo',miss:'Không có ảnh'};
const pill=e=>'<span class="pill '+e.st+'">'+(e.st==='pend'?'Chờ '+e.label:PT[e.st])+'</span>';
function img(e){const f=e.p.f;if(f.properties?.[recordKey])return '';
  S.map[f.id]=f;return'<img class="t" data-id="'+esc(f.id)+'" alt="Arknights Log '+e.label+'">'}
function photoAction(e){const f=e.p.f;return f.properties?.[recordKey]?'<span class="mu">Đã lưu thông tin ca</span>':
  '<button class="log-action mu" type="button" data-remove="'+esc(f.id)+'">Xóa ảnh</button>'}
const resultText=e=>e.p.f.properties?.[recordKey]?(e.st==='bad'?'Ca có cảnh báo':'Ca bình thường'):MSG[e.st];
const more=e=>e.n>1?' <span class="mu">· '+e.n+' ảnh, hiện ảnh mới nhất</span>':'';
function until(ts){const m=Math.max(0,Math.round((ts-Date.now())/6e4)),h=Math.floor(m/60);return m<1?'sắp tới':'còn '+(h?h+' giờ ':'')+p2(m%60)+' phút'}
const nextText=e=>'Chờ ảnh khung '+e.label+' ('+until(e.ts)+')';
function renderChat(E){let o='',last='',np=0;

function connect(allowPopup,forWrite=false){

  if(!selectedFolder||!/^[\w-]+\.apps\.googleusercontent\.com$/.test(clientId)){byId('cfgp').hidden=false;stat.textContent='Kiểm tra lại OAuth Client ID và link hoặc mã thư mục.';return}

    folderId=selectedFolder;listRevision++;nextPage='';loadingMore=false;S.files.clear();Object.values(S.imgs).forEach(p=>p.then(URL.revokeObjectURL,()=>{}));S.imgs={};
    try{localStorage.setItem('drivePhotosClient',clientId);localStorage.setItem('drivePhotosFolder',selectedFolder)}catch{}

  if(!allowPopup){showReconnect();return}
  const authStatus=forWrite?removeStatus:stat,authButton=forWrite?removeConfirm:authorize,requestedScope=forWrite?writeScope:scope;
  authButton.disabled=true;authStatus.textContent='Đang chờ cấp quyền Google…';
  const authError=(code,message)=>{authButton.disabled=false;if(!forWrite)byId('cfgp').hidden=false;
    authStatus.textContent=message+' ('+code+')'};
  let hint='';try{hint=localStorage.getItem('drivePhotosHint')||''}catch{}

    const oauth=window.google?.accounts?.oauth2;
    if(!oauth?.initTokenClient)throw new Error('Thư viện Google Identity Services chưa sẵn sàng.');
    const cfg={client_id:clientId,scope:requestedScope,
      error_callback:error=>{const messages={popup_failed_to_open:'Không mở được cửa sổ Google. Hãy cho phép cửa sổ bật lên trên trang này rồi thử lại.',popup_closed:'Cửa sổ Google đã đóng trước khi cấp quyền. Mở lại và hoàn tất các bước trong cửa sổ đó.'};
        authError(error.type||'unknown',messages[error.type]||'Cửa sổ đăng nhập Google gặp lỗi.')},
      callback:response=>{
        if(response.error)return authError(response.error,response.error_description||'Google từ chối cấp quyền.');
        if(!response.access_token||(!oauth.hasGrantedAllScopes(response,requestedScope)&&

        accessToken=response.access_token;tokenClientId=clientId;tokenExpiresAt=Date.now()+Math.max(0,Number(response.expires_in)-30)*1000;
        canWrite=oauth.hasGrantedAllScopes(response,writeScope);

        /* nhớ email để lần sau Google tự chọn đúng tài khoản */
        if(!hint)fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+accessToken}}).then(r=>r.json()).then(u=>{if(u?.user?.emailAddress)localStorage.setItem('drivePhotosHint',u.user.emailAddress)}).catch(()=>{});
        /* gia hạn token khi đang xem: giữ nguyên danh sách ảnh, chỉ làm mới */
        if(forWrite){authButton.disabled=false;authStatus.textContent='Đã cấp quyền. Kiểm tra lựa chọn rồi bấm xác nhận.'}
        else if(folderId===selectedFolder&&S.files.size){authorize.disabled=false;listPhotos('','',true)}else openFolder();
      }};
    if(hint)cfg.hint=hint;
    oauth.initTokenClient(cfg).requestAccessToken({prompt:''});
  }catch(error){authError('oauth_init_failed',error.message||'Không khởi tạo được đăng nhập Google.')}
}

  if(!chart.hidden)renderStability(S.files.size?build([...S.files.values()],Date.now()):[]);
};
byId('cf').onclick=()=>{const c=byId('cfgp');c.hidden=!c.hidden};
byId('rf').onclick=()=>{if(!folderId||!accessToken||Date.now()>=tokenExpiresAt)showReconnect();else listPhotos('','',true)};
setInterval(()=>{const n=byId('nx');if(n)n.textContent=nextText({label:n.dataset.l,ts:+n.dataset.ts})},3e4);
/* Tự làm mới mỗi 5 phút khi phiên còn hạn; hết hạn thì chỉ cập nhật trạng thái Chờ / Không có ảnh */
setInterval(()=>{if(document.hidden||!folderId)return;
  if(accessToken&&Date.now()<tokenExpiresAt)listPhotos('','',true);else{render();showReconnect()}},3e5);
modeUI();
const googleScript=document.createElement('script');
googleScript.src='https://accounts.google.com/gsi/client';
googleScript.onload=async()=>{
  if(!window.google?.accounts?.oauth2?.initTokenClient){stat.textContent='Trình duyệt chưa tải được chức năng đăng nhập Google. Thử mở bằng Chrome hoặc tắt chặn theo dõi cho trang này.';return}
  try{
    if(settingsUrl)stat.textContent='Đang lấy cấu hình từ NoteEverything…';
    const loaded=await loadSettings();
    stat.textContent=loaded?'Đã nhận cấu hình từ NoteEverything. Bấm Mở thư mục để xem.':'Kết nối bằng tài khoản Google có quyền xem thư mục.';
  }catch{stat.textContent='Chưa đọc được cấu hình đồng bộ. Bạn vẫn có thể kết nối bằng hai ô trên.'}
  authorize.disabled=false;
  try{const k=JSON.parse(localStorage.getItem('drivePhotosTok')||'null');if(k&&k.t&&k.cid===client.value.trim()&&Date.now()<k.exp){accessToken=k.t;tokenClientId=k.cid;tokenExpiresAt=k.exp;canWrite=k.canWrite===true}}catch{}
  if(client.value&&folder.value)connect(false);
};
googleScript.onerror=()=>{stat.textContent='Không tải được đăng nhập Google. Kiểm tra kết nối rồi tải lại trang.'};
document.head.append(googleScript);
</script>
